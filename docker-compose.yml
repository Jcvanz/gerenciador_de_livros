version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gerenciador-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - gerenciador-network

  nginx:
    image: nginx:alpine
    container_name: gerenciador-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - gerenciador-network

  mysql:
    image: mysql:8.0
    container_name: gerenciador-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: gerenciador
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_PASSWORD: dbpassword
      MYSQL_USER: dbuser
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - gerenciador-network

  node:
    image: node:20-alpine
    container_name: gerenciador-node
    restart: unless-stopped
    working_dir: /var/www/frontend
    volumes:
      - ./:/var/www
    ports:
      - "3000:3000"
    command: npm run dev -- --host
    depends_on:
      - app
    networks:
      - gerenciador-network

networks:
  gerenciador-network:
    driver: bridge

volumes:
  dbdata:
    driver: local